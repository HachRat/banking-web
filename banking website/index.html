<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bankingWebsite</title>

<link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class="outer">
    <header>
        <div class="H1">
            <h1>Banking Website</h1>
        </div>
    </header>
    <div class="container">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#create">Create Account</a></li>
                <li><a href="#deposit">Deposit</a></li>
                <li><a href="#withdraw">Withdraw</a></li>
                <li><a href="#balance">Balance</a></li>
            </ul>
        </nav>
    </div>
        <main>
            <div id="home">
                <p><strong>WELCOME</strong></p>
                <p> Use the menu above to create, deposit and check your balance.</p>

            </div>

            <div id = "create">
                <form id="createaccountform">
                <label for="name">Full Name: </label>
                <input type="text" id="name"><br><br>

                <label for="email-account">Email address: </label>
                <input type="email" id="email-account"><br><br>

                <label for="current-deposit">Current Deposit(KShs): </label>
                <input type="number" id="current-deposit"><br><br>

                <button type="submit">Create</button>
                </form>
                <p id="create-message" class="message"></p>
            </div>

            <div id="deposit">
                <h2>Deposit Money</h2>
                <form id="deposit-form">
                    <label for="deposit-amount">Amount(KShs): </label>
                    <input type="number" id="deposit-amount"><br><br>
                    <button type="submit">Deposit</button>
                </form>
                <p id="deposit-message" class="message"></p>
            </div>

            <div id="withdraw">
                <h2>Withdraw funds</h2>
                <form id="withdraw-form">
                    <label for="withdraw-amount">Amount(KShs): </label>
                    <input type="number" id="withdraw-amount"><br><br>
                    <button type="submit">Withdraw</button>
                </form>
                <p id="withdraw-message" class="message"></p>
            </div>

            <div id="balance">
                <h2>Account Balance</h2>
                <button id="balance-display">Check Balance</button>
                <p id="rep"></p>
            </div>
        </main>
        <footer>
            Banking website project
        </footer>

        <script src="script.js"></script>
        </div>
</body>
</html>
